name: git-issue Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        bash-version: ['4.4', '5.0', '5.1']
    
    name: Test with Bash ${{ matrix.bash-version }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Bash ${{ matrix.bash-version }}
      run: |
        if [ "${{ matrix.bash-version }}" != "$(bash --version | head -n1 | cut -d' ' -f4 | cut -d'(' -f1)" ]; then
          echo "Setting up Bash ${{ matrix.bash-version }}"
          # For different bash versions, we'll use the system bash
          # In real scenarios, you might want to install specific versions
        fi
    
    - name: Set up Git
      run: |
        git config --global user.name "Test User"
        git config --global user.email "test@example.com"
        git config --global init.defaultBranch main
    
    - name: Make scripts executable
      run: |
        chmod +x bin/*
        chmod +x tests/*.sh
    
    - name: Install git-issue
      run: make install PREFIX=$HOME/.local
    
    - name: Add to PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Verify installation
      run: |
        which git-issue
        git-issue --help || git issue --help
    
    - name: Run unit tests
      run: ./tests/unit_tests.sh
    
    - name: Run integration tests
      run: ./tests/integration_tests.sh
    
    - name: Run comprehensive test suite
      run: ./tests/test_runner.sh

    - name: Run dependency graph tests
      run: ./tests/test_deps.sh

    - name: Run content safety tests
      run: ./tests/test_content_safety.sh

    - name: Run dispatch tests
      run: ./tests/test_dispatch.sh

    - name: Run install layout smoke test
      run: ./tests/test_install_layout.sh

    - name: Test in clean repository
      run: |
        mkdir -p /tmp/test-clean-repo
        cd /tmp/test-clean-repo
        git init
        git config user.name "Test User"
        git config user.email "test@example.com"
        echo "# Test" > README.md
        git add README.md
        git commit -m "Initial commit"
        
        # Test basic functionality
        git issue create "CI test issue"
        git issue list
        git issue-status

  security-check:
    runs-on: ubuntu-latest
    name: Security Analysis
    
    steps:
    - uses: actions/checkout@v3
    
    - name: ShellCheck Analysis
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './bin'
        format: gcc
        severity: error
    
    - name: Security scan for common vulnerabilities
      run: |
        # Check for potential command injection vulnerabilities
        echo "Scanning for potential security issues..."
        
        # Look for unquoted variables that could lead to injection
        if grep -r '\$[a-zA-Z_][a-zA-Z0-9_]*' bin/ | grep -v '".*\$.*"' | grep -v "'.*\$.*'"; then
          echo "⚠️  Found potentially unquoted variables"
        fi
        
        # Look for eval or direct command execution
        if grep -r 'eval\|system\|exec' bin/; then
          echo "⚠️  Found eval/system/exec usage - review for security"
        fi
        
        # Look for temp file usage
        if grep -r '/tmp/' bin/; then
          echo "⚠️  Found temp file usage - ensure secure handling"
        fi
        
        echo "Security scan completed"

  compatibility-check:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    name: Test on ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Git
      run: |
        git config --global user.name "Test User"
        git config --global user.email "test@example.com"
        git config --global init.defaultBranch main
    
    - name: Test installation
      run: |
        chmod +x bin/* tests/*.sh
        ./install-git-issue.sh
    
    - name: Test basic functionality
      run: |
        # Add install dir to PATH directly (sourcing bashrc may not work in non-interactive CI)
        export PATH="$HOME/.local/bin:$PATH"

        # Test in a temporary directory
        mkdir -p /tmp/git-issue-compat-test
        cd /tmp/git-issue-compat-test
        git init
        git config user.name "Compat Test"
        git config user.email "compat@test.com"
        echo "# Compat Test" > README.md
        git add README.md
        git commit -m "Initial commit"
        
        # Test core commands
        git issue create "Compatibility test"
        git issue list
        git issue-status

  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Git
      run: |
        git config --global user.name "Perf Test"
        git config --global user.email "perf@test.com"
    
    - name: Install git-issue
      run: |
        chmod +x bin/*
        make install PREFIX=$HOME/.local
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Performance test with multiple issues
      run: |
        mkdir -p /tmp/git-issue-perf-test
        cd /tmp/git-issue-perf-test
        git init
        git config user.name "Perf Test"
        git config user.email "perf@test.com"
        echo "# Performance Test" > README.md
        git add README.md
        git commit -m "Initial commit"
        
        echo "Creating 50 test issues..."
        start_time=$(date +%s)
        
        for i in {1..50}; do
          git issue create "Performance test issue $i" >/dev/null 2>&1
        done
        
        create_time=$(date +%s)
        echo "Issue creation took $((create_time - start_time)) seconds"
        
        echo "Testing list performance..."
        list_start=$(date +%s)
        git issue list >/dev/null 2>&1
        list_time=$(date +%s)
        echo "Issue listing took $((list_time - list_start)) seconds"
        
        echo "Testing status performance..."
        status_start=$(date +%s)
        git issue-status >/dev/null 2>&1
        status_time=$(date +%s)
        echo "Status report took $((status_time - status_start)) seconds"
        
        # Performance thresholds
        if [ $((create_time - start_time)) -gt 30 ]; then
          echo "⚠️  Issue creation took longer than expected"
          exit 1
        fi
        
        if [ $((list_time - list_start)) -gt 5 ]; then
          echo "⚠️  Issue listing took longer than expected"
          exit 1
        fi
        
        echo "✅ Performance tests passed"

  rfc-conformance:
    runs-on: ubuntu-latest
    name: RFC Conformance

    steps:
    - uses: actions/checkout@v3

    - name: Set up Git
      run: |
        git config --global user.name "Test User"
        git config --global user.email "test@example.com"

    - name: Clone RFC tooling
      run: git clone --depth 1 https://github.com/nnunley/llm-rfc-skill /tmp/llm-rfc-skill

    - name: Lint all RFC documents
      run: |
        # Collect all RFC files (drafts and published, excluding index.md)
        rfc_files=$(find docs/rfc -maxdepth 1 -type f \( -name 'draft-*.md' -o -name '[0-9]*.md' \))
        if [ -z "$rfc_files" ]; then
          echo "No RFC files found to lint"
          exit 0
        fi
        /tmp/llm-rfc-skill/skill/rfc-lint $rfc_files

    - name: Run conformance tests (published RFCs)
      run: |
        # Guard: only run rfc-run if published RFCs exist
        if [ "$(find docs/rfc -maxdepth 1 -type f -name '[0-9]*.md' | wc -l)" -gt 0 ]; then
          /tmp/llm-rfc-skill/skill/rfc-run docs/rfc/[0-9]*.md
        else
          echo "No published RFCs yet (expected at this stage)"
        fi

    - name: Verify draft corpus declarations (blocking — red only by declaration)
      run: |
        if [ "$(find docs/rfc -maxdepth 1 -type f -name 'draft-*.md' | wc -l)" -gt 0 ]; then
          /tmp/llm-rfc-skill/skill/rfc-run --expect docs/rfc/draft-*.md
        else
          echo "No draft RFCs found"
        fi

    - name: Per-document conformance report
      if: always()
      run: |
        shopt -s nullglob
        {
          echo "### RFC conformance — per document"
          echo ""
          echo "| document | lint | corpus | declared |"
          echo "|---|---|---|---|"
          for f in docs/rfc/draft-*.md docs/rfc/[0-9]*.md; do
            n=$(basename "$f" .md)
            /tmp/llm-rfc-skill/skill/rfc-lint "$f" >/dev/null 2>&1 && L="ok" || L="**FAIL**"
            if /tmp/llm-rfc-skill/skill/rfc-run "$f" >/dev/null 2>&1; then C="green"; else C="red"; fi
            d=$(sed -n 's/^\*\*Corpus:\*\* *//p' "$f" | head -1); d="${d%% *}"; d="${d:-green}"
            [ "$C" = "$d" ] && D="$d" || D="**$d (STALE)**"
            echo "| $n | $L | $C | $D |"
          done
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash